name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks-action needs a token to enumerate a pull request's commits. Without it the
    # job fails on every PR while still passing on push, so this stayed invisible until
    # `main` became PR-only. `pull-requests: read` is the enumeration; `contents: read`
    # comes from the workflow default.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # `pnpm test` is `pnpm -r test`, which reaches each package's `test`
      # script. @freeforever/data's is `vitest run --project unit`, so the
      # sync projects — a separate vitest config under src/sync/__tests__ —
      # are invisible to it. Named explicitly here rather than left to a
      # recursive run that cannot see them.
      #
      # sync-unit needs no emulator: reducers, merges, calendar maths, the
      # App Check guard. It belongs with the other unit tests, and the
      # emulator-dependent half runs in the `sync-emu` job below.
      - name: Sync unit suite
        run: pnpm --filter @freeforever/data test:sync

  rules:
    name: Security rules (Firestore + Storage)
    runs-on: ubuntu-latest
    # Rules are public (ADR-0015), so they must actually hold. Blocking.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # The Firebase emulators are Java, and firebase-tools 15.29 raised its floor
      # to JDK 21 — the first CI run this repo ever had died on exactly that, with
      # `firebase-tools no longer supports Java version before 21`. Nothing we wrote
      # changed; a dependency moved. Pinned here rather than pinning firebase-tools,
      # because the emulators should track upstream and the JDK is the cheap half.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: pnpm install --frozen-lockfile

      # BOTH emulators. storage.rules governs progress-photo bytes (ADR-0023)
      # and test/rules/storage.test.ts needs the Storage emulator to exercise
      # it; with `--only firestore` those 40 tests skip and the file errors in
      # cleanup, so this job has been failing rather than quietly under-testing.
      #
      # --project matches PROJECT_ID in test/rules/harness.ts so the emulator's
      # single-project namespace is the one the tests actually address. It is
      # not a safety boundary: the harness passes its own projectId to
      # initializeTestEnvironment, so --project cannot constrain what the tests
      # reach. What makes this safe is that emulators:exec runs with no
      # credentials and the SDK is pointed at localhost.
      - name: Firestore + Storage rules
        run: >-
          npx firebase-tools emulators:exec
          --project freeforever-rules-test
          --only firestore,storage
          "pnpm test:rules"

  sync-emu:
    name: Sync engine (emulator)
    runs-on: ubuntu-latest
    # Kept separate from the rules job on purpose, not merged for speed:
    #
    #   - The two suites need different emulator sets (firestore,storage vs
    #     firestore,auth). One job starting all three would let a rules test
    #     silently acquire an Auth dependency it never declared — the exact
    #     ADR-0015 failure mode of a suite whose infrastructure needs are
    #     invisible.
    #   - `emulators:exec` runs one command, so merging means `a && b` and the
    #     second suite never runs when the first fails. Two jobs report both
    #     failures in a single run.
    #   - Separate jobs run in parallel, so this is also faster in wall-clock
    #     than one job running both suites in sequence.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # The Firebase emulators are Java, and firebase-tools 15.29 raised its floor
      # to JDK 21 — the first CI run this repo ever had died on exactly that, with
      # `firebase-tools no longer supports Java version before 21`. Nothing we wrote
      # changed; a dependency moved. Pinned here rather than pinning firebase-tools,
      # because the emulators should track upstream and the JDK is the cheap half.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: pnpm install --frozen-lockfile

      # Auth is not optional here: the suite exercises the anonymous-to-linked
      # upgrade path (ADR-0009), which is where a bug silently destroys someone's
      # training history. Blocking for the same reason the rules job is.
      #
      # --project matches EMULATOR_PROJECT in src/sync/__tests__/emuHarness.ts,
      # and the command is the one documented at the top of that file. A
      # mismatch still passes — singleProjectMode only warns — so keeping these
      # aligned is about not leaving a discrepancy for someone to debug later.
      - name: Sync engine against emulators
        run: >-
          npx firebase-tools emulators:exec
          --project demo-freeforever-sync
          --only firestore,auth
          "pnpm --filter @freeforever/data test:sync:emu"

  tokens:
    name: Design token guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Contrast ratios asserted as unit tests so a palette change cannot
      # silently break WCAG AA. See ADR-0013.
      - run: pnpm --filter @freeforever/design-system test
      # No raw hex/px/ms outside the design system. See ADR-0021.
      - run: pnpm lint

  # ---------------------------------------------------------------- deploy

  # Until this job existed, CI proved the code was sound and had nothing to do with what
  # was live: every deploy was a laptop running `firebase deploy`, and nothing stopped a
  # red build being shipped by hand. A green tick that does not gate the deploy is a
  # claim other people will reasonably misread, which matters more once the repo is
  # public.
  #
  # No stored credential. `google-github-actions/auth` federates into GCP via Workload
  # Identity Federation (ADR-0011): GitHub mints a short-lived OIDC token, GCP trades it
  # for one that expires in an hour, and there is no service-account key anywhere to
  # leak. The trust is pinned to one subject — `environment:production` on this
  # repository, by numeric repo and owner id — so a fork, a rename, or a push to another
  # branch cannot assume the identity.
  #
  # `environment: production` is what makes that subject match, and it is also where
  # required reviewers go if this should ever need a human before it ships.
  #
  # Known gap, stated rather than left to be discovered: Lighthouse is a separate
  # workflow and does not gate this. Its accessibility and PWA assertions are
  # error-level, so a regression there can still reach production. Closing that means
  # either folding the audit into this workflow or gating on `workflow_run`, and it is
  # the obvious next step rather than something this job pretends to cover.
  deploy:
    name: Deploy to Hosting
    needs: [secrets, verify, rules, sync-emu, tokens]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      # Proves the federation worked before firebase-tools gets a chance to misreport it.
      # `auth` above reports success merely for writing the credential file, and
      # firebase-tools catches any real exchange failure and replaces it with "have you
      # run `firebase login`?" — which sent the first two attempts looking in the wrong
      # place entirely. If the exchange is broken, it should say so here.
      # Prints the claims GCP matches the binding against — never the token, which is a
      # credential. Two runs died on `iam.serviceAccounts.getAccessToken` denied while
      # the binding read exactly right, so the only thing left to check is what GitHub
      # actually sends as `sub`.
      - name: What subject does GitHub send
        uses: actions/github-script@v7
        with:
          script: |
            const t = await core.getIDToken(
              'https://iam.googleapis.com/${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
            );
            const c = JSON.parse(Buffer.from(t.split('.')[1], 'base64url').toString());
            core.info('sub            = ' + c.sub);
            core.info('aud            = ' + c.aud);
            core.info('repository     = ' + c.repository);
            core.info('repository_id  = ' + c.repository_id);
            core.info('owner_id       = ' + c.repository_owner_id);
            core.info('environment    = ' + c.environment);
            core.info('event_name     = ' + c.event_name);

      - uses: google-github-actions/setup-gcloud@v2
      - name: Who am I
        run: |
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud auth print-access-token >/dev/null && echo "token exchange OK"

      # Built here rather than reusing an artefact from `verify`, so what ships is built
      # from the commit being deployed by a job that just authenticated as the deployer.
      - run: pnpm --filter @freeforever/web build

      # `firebase-tools` picks up GOOGLE_APPLICATION_CREDENTIALS, which the auth step
      # wrote. Hosting only: this job has no business touching rules or Cloud Run on a
      # normal app deploy, even though the deployer is permitted to.
      - name: Deploy
        run: >
          npx --yes firebase-tools@15 deploy
          --only hosting
          --project ${{ vars.GCP_PROJECT_ID }}
          --non-interactive
          --debug

  # CONTRIBUTING and the README both require `git commit -s`, and nothing checked it.
  # An unsigned commit is not a style problem: the DCO is what lets this project promise
  # it can never be relicensed out from under its contributors, and that promise is only
  # as good as the trailers actually being there.
  #
  # Pull requests only. Rewriting `main`'s history to add a missing trailer would be a
  # worse cure than the disease.
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every commit in this PR is signed off
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git rev-list "$base..$head"); do
            if ! git log -1 --format='%B' "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") has no Signed-off-by trailer"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Fix with:  git rebase --signoff $base"
            echo "Then:      git push --force-with-lease"
            echo ""
            echo "The DCO is at https://developercertificate.org/ — no CLA, you keep your copyright."
            exit 1
          fi
          echo "All commits signed off."

